[project]
name = "rag-reranker-lab"
version = "0.1.0"
description = "Hybrid retrieval and cross-encoder reranking, measured against a hand-labelled set"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=3.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
